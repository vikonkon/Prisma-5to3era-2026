    <!-- Lado derecho: formularios -->
    <div class="der">
      <p id="msg" class="msg" role="alert" hidden></p>

      <form id="form-login">
        <h1>Ingresar</h1>
        <label for="login-correo">Correo electrónico</label>
        <input type="email" id="login-correo" autocomplete="email" required>
        <label for="login-clave">Contraseña</label>
        <input type="password" id="login-clave" autocomplete="current-password" required>
        <button type="submit" class="btn">Entrar a Prisma</button>
        <p class="cambio">¿No tenés cuenta? <a href="#" id="ir-registro">Registrate</a></p>
      </form>

      <form id="form-registro" hidden>
        <h1>Crear cuenta</h1>
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" autocomplete="given-name" required>
        <label for="reg-apellido">Apellido</label>
        <input type="text" id="reg-apellido" autocomplete="family-name" required>
        <label for="reg-correo">Correo electrónico</label>
        <input type="email" id="reg-correo" autocomplete="email" required>
        <label for="reg-clave">Contraseña</label>
        <input type="password" id="reg-clave" autocomplete="new-password" required>
        <label for="reg-direccion">Dirección</label>
        <input type="text" id="reg-direccion" required>
        <label for="reg-cuit">CUIT (solo números)</label>
        <input type="text" id="reg-cuit" inputmode="numeric" pattern="[0-9]{10,11}" required>
        <button type="submit" class="btn">Crear mi cuenta</button>
        <p class="cambio">¿Ya tenés cuenta? <a href="#" id="ir-login">Ingresá</a></p>
      </form>
    </div>
