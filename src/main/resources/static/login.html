<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisma · Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="img/hilo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="acceso">
  <div class="tarjeta">

    <!-- Lado izquierdo: dibujo -->
    <div class="izq">
      <img class="logo-grande" src="img/logo-web.svg" alt="Prisma">
      <div class="escena">
        <svg viewBox="0 0 220 190" role="img" aria-label="Perchero con prendas">
          <g stroke="#0D2B45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 28H206M14 28V182M206 28V182M4 182H24M196 182H216" fill="none"/>
            <path d="M60 28v10M115 28v10M170 28v10" fill="none"/>
            <path d="M60 38L44 48L30 58L37 72L44 67V120H76V67L83 72L90 58L76 48Z" fill="#6BA7A0"/>
            <path d="M115 38L98 48L100 128H112L115 84L118 128H130L132 48Z" fill="#DCC8AA"/>
            <path d="M170 38L152 48L138 58L145 76L152 70V124H188V70L195 76L202 58L188 48Z" fill="#B7D4E6"/>
            <path d="M170 48V124" fill="none"/>
          </g>
        </svg>
        <img src="img/hilo.svg" alt="Hilo, la mascota de Prisma">
      </div>
      <p>Ropa vintage con una segunda vida.</p>
    </div>

    <!-- Lado derecho: formularios -->
    <div class="der">
      <p id="msg" class="msg" role="alert" hidden></p>

      <form id="form-login">
        <h1>Ingresar</h1>
        <label for="login-correo">Correo electrónico</label>
        <input type="email" id="login-correo" autocomplete="email" required>
        <label for="login-clave">Contraseña</label>
        <input type="password" id="login-clave" autocomplete="current-password" required>
        <button type="submit" class="btn">Entrar a Prisma</button>
        <p class="cambio">¿No tenés cuenta? <a href="#" id="ir-registro">Registrate</a></p>
      </form>

      <form id="form-registro" hidden>
        <h1>Crear cuenta</h1>
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" autocomplete="given-name" required>
        <label for="reg-apellido">Apellido</label>
        <input type="text" id="reg-apellido" autocomplete="family-name" required>
        <label for="reg-correo">Correo electrónico</label>
        <input type="email" id="reg-correo" autocomplete="email" required>
        <label for="reg-clave">Contraseña</label>
        <input type="password" id="reg-clave" autocomplete="new-password" required>
        <label for="reg-direccion">Dirección</label>
        <input type="text" id="reg-direccion" required>
        <label for="reg-cuit">CUIT (solo números)</label>
        <input type="text" id="reg-cuit" inputmode="numeric" pattern="[0-9]{10,11}" required>
        <button type="submit" class="btn">Crear mi cuenta</button>
        <p class="cambio">¿Ya tenés cuenta? <a href="#" id="ir-login">Ingresá</a></p>
      </form>
    </div>

  </div>
  <script src="js/login.js"></script>
</body>
</html>
