<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 232 262" role="img" aria-label="Hilo, la mascota de Prisma" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<!-- Efecto "estampa": borde blanco alrededor de toda la silueta + sombrita -->
<filter id="estampa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feMorphology in="SourceAlpha" operator="dilate" radius="6" result="borde"/>
<feGaussianBlur in="borde" stdDeviation="2.5" result="difuso"/>
<feOffset in="difuso" dx="2" dy="4" result="desplazado"/>
<feFlood flood-color="#0D2B45" flood-opacity=".35"/>
<feComposite in2="desplazado" operator="in" result="sombra"/>
<feFlood flood-color="#ffffff"/>
<feComposite in2="borde" operator="in" result="blanco"/>
<feMerge><feMergeNode in="sombra"/><feMergeNode in="blanco"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
